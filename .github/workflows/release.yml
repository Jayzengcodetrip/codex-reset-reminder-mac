name: Release Mac app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      RELEASE_TAG: v0.2.0
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Check tag matches app version
        shell: bash
        run: |
          app_version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          test "${RELEASE_TAG}" = "v${app_version}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = "${RELEASE_TAG}"
          fi
      - name: Check behavior contracts and tests
        run: |
          ./scripts/check_contracts.sh
          swift test
      - name: Package Mac app
        run: RUN_TESTS=0 ./scripts/release.sh
      - name: Check reset and window behavior
        run: |
          dist/CodexNotch.app/Contents/MacOS/CodexNotch --verify-reset-behavior
          dist/CodexNotch.app/Contents/MacOS/CodexNotch --verify-window-restoration
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            target_option=(--verify-tag)
          else
            target_option=(--target "${GITHUB_SHA}")
          fi
          gh release create "${RELEASE_TAG}" \
            dist/CodexNotch-*.dmg \
            dist/CodexNotch-*.zip \
            dist/CodexNotch-*.sha256 \
            "${target_option[@]}" \
            --title "Codex 重置提醒 ${RELEASE_TAG}" \
            --notes-file docs/releases/v0.2.0.md
