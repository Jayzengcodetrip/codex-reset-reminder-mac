name: Release Mac app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Confirm Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Resolve release version and notes
        shell: bash
        run: |
          app_version="$(plutil -extract CFBundleShortVersionString raw -o - Resources/Info.plist)"
          [[ "${app_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          release_tag="v${app_version}"
          release_notes="docs/releases/${release_tag}.md"
          test -s "${release_notes}"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = "${release_tag}"
          fi
          printf 'RELEASE_TAG=%s\nRELEASE_NOTES=%s\n' "${release_tag}" "${release_notes}" >> "${GITHUB_ENV}"
      - name: Check behavior contracts and tests
        run: |
          ./scripts/check_contracts.sh
          python3 scripts/test_prune_release_artifacts.py
          swift test
      - name: Package Mac app
        run: RUN_TESTS=0 ./scripts/release.sh
      - name: Check reset and window behavior
        run: |
          dist/CodexNotch.app/Contents/MacOS/CodexNotch --verify-reset-behavior
          dist/CodexNotch.app/Contents/MacOS/CodexNotch --verify-window-restoration
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            target_option=(--verify-tag)
          else
            target_option=(--target "${GITHUB_SHA}")
          fi
          gh release create "${RELEASE_TAG}" \
            dist/CodexNotch-*.dmg \
            dist/CodexNotch-*.zip \
            dist/CodexNotch-*.sha256 \
            "${target_option[@]}" \
            --title "Codex 重置提醒 ${RELEASE_TAG}" \
            --latest \
            --notes-file "${RELEASE_NOTES}"
